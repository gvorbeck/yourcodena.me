name: Deploy to Firebase Hosting
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  checks: write
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 } # full history, so the Functions check below can diff against the previous push
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: '**/package-lock.json' }
      - run: npm ci
      - run: npm ci --prefix functions # the bot's tests import firebase-admin
      - run: npm run lint
      - run: npm test
      # Runs firestore.rules in the emulator (Java is preinstalled on ubuntu-latest) before they can be deployed.
      - run: npm run test:rules
      # Browser tests: the app against the emulator, through Playwright.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_APPCHECK_SITE_KEY: ${{ secrets.VITE_APPCHECK_SITE_KEY }}
      # Rules go first, so a new build never runs against old rules that reject its fields. Open tabs keep running the
      # old build, so rules must accept both builds' writes: add a field in one release, stop allowing it in a later one.
      # The hosting action ships Hosting only. The service account needs the "Firebase Rules Admin" role for this step.
      # Tools that receive the service account are pinned: bump these by hand.
      - name: Deploy Firestore rules
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CODENAME_DG }}
        run: |
          printf '%s' "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" npx --yes firebase-tools@15.34.1 deploy --only firestore:rules --project codename-dg
          rm -f "$RUNNER_TEMP/sa.json"
      # The bot bundles shared files from src/ at deploy time, so it must redeploy when they change or Discord shows stale
      # chances. esbuild's metafile lists exactly which ones, so a UI-only change doesn't redeploy every Function.
      # Manual runs and pushes with no usable "before" commit always deploy.
      - name: Check whether Functions changed
        id: functions
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" != push ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          elif npx --prefix functions esbuild functions/src/index.ts --bundle --platform=node --format=esm --packages=external \
                 --metafile="$RUNNER_TEMP/meta.json" --outfile="$RUNNER_TEMP/bot.js" --log-level=error \
               && SHARED=$(node -e "console.log(Object.keys(require(process.argv[1]).inputs).filter((f) => !f.startsWith('functions/')).join(' '))" "$RUNNER_TEMP/meta.json") \
               && git diff --quiet "$BEFORE" HEAD -- functions $SHARED; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
      # Before Hosting, so a new build never calls a Function that isn't live yet. No --force: a Function missing from
      # the code fails the deploy instead of being deleted. The service account needs the roles listed in the README.
      - name: Deploy Functions
        if: steps.functions.outputs.deploy == 'true'
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CODENAME_DG }}
        run: |
          printf '%s' "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" npx --yes firebase-tools@15.34.1 deploy --only functions --project codename-dg --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
      - uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CODENAME_DG }}
          channelId: live
          projectId: codename-dg
